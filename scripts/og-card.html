<!doctype html>
<!-- Share card source. public/og.png is a 1200x630 screenshot of this page (fonts resolve after npm install). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og card</title>
    <style>
      @font-face {
        font-family: 'Spline Sans';
        font-weight: 300 700;
        src: url('../node_modules/@fontsource-variable/spline-sans/files/spline-sans-latin-wght-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Spline Sans Mono';
        font-weight: 300 700;
        src: url('../node_modules/@fontsource-variable/spline-sans-mono/files/spline-sans-mono-latin-wght-normal.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background:
          radial-gradient(760px 420px at 18% -80px, #22183d, transparent 70%),
          radial-gradient(420px 260px at 83% 104%, rgb(142 109 224 / 0.22), transparent 70%),
          #120c20;
        color: #ece6f8;
        font-family: 'Spline Sans', sans-serif;
      }
      .text {
        position: absolute;
        left: 76px;
        top: 70px;
      }
      h1 {
        margin: 0;
        font-size: 124px;
        font-weight: 600;
        line-height: 0.95;
        letter-spacing: -0.045em;
      }
      p {
        margin: 22px 0 0;
        color: #a99dc6;
        font-size: 33px;
        line-height: 1.3;
      }
      .term {
        position: absolute;
        left: 76px;
        bottom: 64px;
        width: 590px;
        border: 1px solid #3f3264;
        border-radius: 16px;
        background: #0c0816;
        font: 400 21px/1.65 'Spline Sans Mono', monospace;
        box-shadow: 0 30px 70px -24px rgb(4 0 12 / 0.9);
      }
      .bar {
        padding: 11px 22px;
        border-bottom: 1px solid #2b2146;
        color: #ece6f8;
        font-size: 16px;
      }
      .bar span {
        color: #c6b3f7;
      }
      .out {
        padding: 14px 22px 18px;
        white-space: pre;
      }
      .p {
        color: #c6b3f7;
      }
      .m {
        color: #a99dc6;
      }
      .cur {
        display: inline-block;
        width: 0.6em;
        height: 1.1em;
        margin-left: 2px;
        vertical-align: -0.2em;
        background: #c6b3f7;
      }
      .bro {
        position: absolute;
        right: 70px;
        bottom: 26px;
        height: 560px;
        filter: drop-shadow(0 18px 14px rgb(4 0 12 / 0.5));
      }
      .floor {
        position: absolute;
        right: 88px;
        bottom: 18px;
        width: 330px;
        height: 34px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgb(142 109 224 / 0.45), transparent);
      }
    </style>
  </head>
  <body>
    <div class="text">
      <h1>vyvanse.beer</h1>
      <p>Browser games, meme sites and<br />small worlds by dexedrne.</p>
    </div>
    <div class="term">
      <div class="bar">dexedrne@vyvanse <span>~</span></div>
      <div class="out">
        <div><span class="p">vyvanse:~$</span> ls games</div>
        <div class="m">rugrun  solscape  robinscape  bitcorn</div>
        <div><span class="p">vyvanse:~$</span> open rugrun<span class="cur"></span></div>
      </div>
    </div>
    <div class="floor"></div>
    <img class="bro" src="../public/img/radbros/radbro-4764-hero.webp" alt="" />
  </body>
</html>
