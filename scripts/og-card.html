<!doctype html>
<!-- Share card source. public/og.png is a 1200x630 screenshot of this page (fonts resolve after npm install). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og card</title>
    <style>
      @font-face {
        font-family: 'Spline Sans';
        font-weight: 300 700;
        src: url('../node_modules/@fontsource-variable/spline-sans/files/spline-sans-latin-wght-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Spline Sans Mono';
        font-weight: 300 700;
        src: url('../node_modules/@fontsource-variable/spline-sans-mono/files/spline-sans-mono-latin-wght-normal.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #120c20 url('og-backdrop.jpg') center / cover no-repeat;
        color: #ece6f8;
        font-family: 'Spline Sans', sans-serif;
      }
      /* darken the left side so the text holds up at thumbnail size */
      .veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, rgb(12 8 22 / 0.72) 0%, rgb(12 8 22 / 0.45) 48%, rgb(12 8 22 / 0) 72%);
      }
      .copy {
        position: absolute;
        left: 76px;
        top: 150px;
        width: 700px;
      }
      h1 {
        margin: 0;
        font-weight: 700;
        font-size: 104px;
        line-height: 1;
        letter-spacing: -0.035em;
        color: #f3eefc;
        text-shadow: 0 2px 24px rgb(10 4 22 / 0.6);
      }
      h1 span {
        color: #c6b3f7;
      }
      p {
        margin: 26px 0 0;
        font-size: 38px;
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: -0.01em;
        color: #dacdfb;
      }
      .prompt {
        position: absolute;
        left: 76px;
        bottom: 88px;
        display: inline-flex;
        align-items: center;
        padding: 16px 24px;
        border-radius: 12px;
        background: rgb(12 8 22 / 0.8);
        border: 1.5px solid rgb(198 179 247 / 0.32);
        box-shadow: 0 10px 40px rgb(4 0 12 / 0.5);
        font-family: 'Spline Sans Mono', monospace;
        font-size: 30px;
        font-weight: 500;
        color: #ece6f8;
      }
      .u {
        color: #c6b3f7;
      }
      .d {
        color: #a99dc6;
      }
      .cursor {
        display: inline-block;
        width: 16px;
        height: 32px;
        margin-left: 10px;
        border-radius: 2px;
        background: #c6b3f7;
        box-shadow: 0 0 14px rgb(198 179 247 / 0.7);
      }
      .bro {
        position: absolute;
        right: 56px;
        bottom: 0;
        height: 585px;
        filter: drop-shadow(0 18px 26px rgb(4 0 12 / 0.65)) drop-shadow(0 0 40px rgb(142 109 224 / 0.2));
      }
    </style>
  </head>
  <body>
    <div class="veil"></div>
    <div class="copy">
      <h1>vyvanse<span>.</span>beer</h1>
      <p>things dexedrne makes<br />for the internet</p>
    </div>
    <div class="prompt"><span class="u">dexedrne@vyvanse</span><span class="d">:</span><span class="u">~</span><span class="d">$</span>&nbsp;ls<span class="cursor"></span></div>
    <img class="bro" src="../public/img/radbros/radbro-4764-hero.webp" alt="" />
  </body>
</html>
